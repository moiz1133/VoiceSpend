services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voicespend
      POSTGRES_PASSWORD: voicespend
      POSTGRES_DB: voicespend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicespend -d voicespend"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voicespend:voicespend@postgres:5432/voicespend
      REDIS_URL: redis://redis:6379/0
      # Own-container-local dir (never shared with worker/beat — see the
      # multiprocess-mode note in app/core/metrics.py and
      # app/worker/celery_app.py for why sharing it across containers
      # would collide on PID-based filenames).
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Anonymous volume shadows the bind mount for .venv, so the image's
      # baked (Linux) virtualenv is used instead of whatever .venv happens
      # to exist on the host (which may not even exist, or be built for a
      # different OS) — avoids a slow full reinstall on every `up`.
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voicespend:voicespend@postgres:5432/voicespend
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      # This worker's OWN metrics (fx_last_successful_ingest_timestamp,
      # fx_ingest_failure_total, etc.) — a separate scrape target from the
      # api's /metrics, never the same PROMETHEUS_MULTIPROC_DIR. See
      # app/worker/celery_app.py.
      - "9808:9808"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # -A takes module:attr — celery_app.py defines `celery_app`, not the
    # bare-module convention celery's CLI otherwise assumes.
    command: sh -c "echo 'voicespend celery worker starting' && uv run celery -A app.worker.celery_app:celery_app worker --loglevel=info"

  beat:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voicespend:voicespend@postgres:5432/voicespend
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Deliberately a separate service from `worker` — beat only schedules
    # tasks, it never executes them, so it should never share a container
    # (or crash domain) with the worker that does. No PROMETHEUS_MULTIPROC_DIR
    # here: beat enqueues tasks but never runs task bodies, so it never
    # increments a metric itself.
    command: uv run celery -A app.worker.celery_app:celery_app beat --loglevel=info

volumes:
  pgdata:
